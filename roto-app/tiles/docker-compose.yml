services:
  postgres:
    image: postgis/postgis:16-3.4
    ports: ["54322:5432"]
    environment:
      POSTGRES_PASSWORD: postgres
    volumes: ["roto-pgdata:/var/lib/postgresql/data"]
    restart: unless-stopped
  martin:
    image: maplibre/martin:latest
    ports: ["3005:3000"]
    volumes: ["./data:/data:ro", "./martin.yaml:/martin.yaml:ro"]
    # Sources live in martin.yaml (sri-lanka mbtiles + the road_curvature `curvature` layer);
    # with a config file martin takes no source arguments.
    command: -c /martin.yaml
    depends_on: [postgres]
    restart: unless-stopped
  valhalla:
    image: ghcr.io/valhalla/valhalla:latest
    ports: ["8002:8002"]
    volumes: ["./valhalla:/custom_files"]
    command: valhalla_service /custom_files/valhalla.json 1
    restart: unless-stopped

volumes:
  roto-pgdata:
